
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム｜先生用管理画面</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
    <p>先生用管理画面</p>
  </header>

  
<main>
  
<section id="loginArea">
  <h2>先生用ログイン</h2>

  <p>メールアドレス</p>
  <input
    type="email"
    id="adminEmail"
    autocomplete="username"
    placeholder="メールアドレス"
  >

  <p>パスワード</p>
  <input
    type="password"
    id="adminPassword"
    autocomplete="current-password"
    placeholder="パスワード"
  >

  <p>
    <button id="loginButton" disabled>
      ログイン（準備中）
    </button>
  </p>
</section>
<hr>

  
<section id="adminArea" style="display:none;">
<h2>問題データ管理</h2>


  <h3>① 検定の選択</h3>
  <select id="examType">
    <option value="joho_shori">情報処理</option>
    <option value="joho_shori_2">情報処理２級</option>
    <option value="joho_kiso">情報基礎</option>
    <option value="bunsho_3">文書３級</option>
    <option value="bunsho_2">文書２級</option>
    <option value="bunsho_1">文書１級</option>
  </select>

  <h3>② 問題グループの登録</h3>
  <p>登録する問題のグループ名を入力してください。</p>
  <input
    type="text"
    id="groupName"
    placeholder="例：第1回 基礎問題"
  >

  <p>CSVファイルを選択してください。</p>
  <input type="file" id="csvFile" accept=".csv">

  <p>
    <button disabled>CSVを登録（準備中）</button>
  </p>

  <hr>

  <h3>③ 出題するグループの選択</h3>
  <p>チェックしたグループから生徒に出題します。</p>

  <div id="groupList">
    グループ一覧は準備中です。
  </div>

  <p>
    <button disabled>出題設定を保存（準備中）</button>
  </p>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpXARufKNeaNgBOv30i83mQH5LXuswgBI",
  authDomain: "kentei-bff27.firebaseapp.com",
  projectId: "kentei-bff27",
  appId: "1:693090582582:web:3a0d01c693dd9b6d779897"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginButton = document.getElementById("loginButton");
loginButton.disabled = false;
loginButton.textContent = "ログイン";

loginButton.addEventListener("click", async () => {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("loginArea").style.display = "none";
document.getElementById("adminArea").style.display = "block";

    alert("ログインに成功しました。");
  } catch (error) {
    console.error("ログインエラー：", error.code);
    alert("ログインできませんでした。メールアドレスとパスワードを確認してください。");
  }
});
</script>

</body>
</html>
