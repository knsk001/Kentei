
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム｜先生用管理画面</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
    <p>先生用管理画面</p>
  </header>

  
<main>
  <h2>問題データ管理</h2>

  <h3>① 検定の選択</h3>
  <select id="examType">
    <option value="joho_shori">情報処理</option>
    <option value="joho_shori_2">情報処理２級</option>
    <option value="joho_kiso">情報基礎</option>
    <option value="bunsho_3">文書３級</option>
    <option value="bunsho_2">文書２級</option>
    <option value="bunsho_1">文書１級</option>
  </select>

  <h3>② 問題グループの登録</h3>
  <p>登録する問題のグループ名を入力してください。</p>
  <input
    type="text"
    id="groupName"
    placeholder="例：第1回 基礎問題"
  >

  <p>CSVファイルを選択してください。</p>
  <input type="file" id="csvFile" accept=".csv">

  <p>
    <button disabled>CSVを登録（準備中）</button>
  </p>

  <hr>

  <h3>③ 出題するグループの選択</h3>
  <p>チェックしたグループから生徒に出題します。</p>

  <div id="groupList">
    グループ一覧は準備中です。
  </div>

  <p>
    <button disabled>出題設定を保存（準備中）</button>
  </p>
</main>

</body>
</html>
