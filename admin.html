    groupList.innerHTML = "";

      groupList.textContent = "登録されているグループはありません。";

    }

    
const selectedExamId =

snapshot.forEach((doc) => {

async function readCsvFile() {
  const fileInput = document.getElementById("csvFile");
  const file = fileInput.files[0];

  if (!file) {
    alert("CSVファイルを選択してください。");
    return null;
  }

  try {
    const text = await file.text();
    console.log("CSVファイル読み込み完了：", file.name);
    return text;
  } catch (error) {
    console.error("CSV読み込みエラー：", error);
    alert("CSVファイルを読み込めませんでした。");
    return null;
  }
}

function parseCsv(text) {
  // CSVを行・列に分解（引用符内のカンマや改行にも対応）
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        value += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === "," && !quoted) {
      row.push(value);
      value = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(value);
      rows.push(row);
      row = [];
      value = "";
    } else {
      value += c;
    }
  }

  if (quoted) {
    throw new Error("CSVの引用符が閉じられていません。");
  }

  if (value !== "" || row.length > 0) {
    row.push(value);
    rows.push(row);
  }

  // 空行を除外
  const validRows = rows.filter(r =>
    r.some(cell => cell.trim() !== "")
  );

  const headers = [
    "examId", "group", "question",
    "choice1", "choice2", "choice3",
    "choice4", "answer"
  ];

  if (!validRows.length ||
      validRows[0].map(v => v.trim()).join(",") !== headers.join(",")) {
    throw new Error("CSVの見出し8列が正しくありません。");
  }

  return validRows.slice(1).map((r, i) => {
    if (r.length !== 8) {
      throw new Error(`${i + 2}行目の列数が8列ではありません。`);
    }

    const data = Object.fromEntries(
      headers.map((key, j) => [key, r[j].trim()])
    );

    const answer = Number(data.answer);

    if (!data.examId || !data.group ||
        !data.question || !data.choice1 ||
        !data.choice2 || !data.choice3 ||
        !data.choice4 ||
        !["1", "2", "3", "4"].includes(data.answer)) {
      throw new Error(`${i + 2}行目に未入力または不正な値があります。`);
    }

    return { ...data, answer };
  });
}

document.getElementById("csvFile").addEventListener("change", async () => {
  const preview = document.getElementById("csvPreview");
  const content = document.getElementById("csvPreviewContent");

  preview.style.display = "block";
  content.textContent = "CSVを確認しています...";

  try {
    const text = await readCsvFile();

    if (text === null) {
      preview.style.display = "none";
      return;
    }

    const questions = parseCsv(text);

    // 検定・グループごとの問題数を集計
    const counts = new Map();

    questions.forEach(q => {
      const key = JSON.stringify([q.examId, q.group]);
      counts.set(key, (counts.get(key) || 0) + 1);
    });

    // プレビュー表示
    content.replaceChildren();

    const total = document.createElement("p");
    total.textContent = `登録予定：${questions.length}問`;
    content.appendChild(total);

    const table = document.createElement("table");
    table.style.width = "100%";

    const header = document.createElement("tr");
    ["検定ID", "グループ", "問題数"].forEach(name => {
      const th = document.createElement("th");
      th.textContent = name;
      header.appendChild(th);
    });
    table.appendChild(header);

    counts.forEach((count, key) => {
      const [examId, group] = JSON.parse(key);
      const tr = document.createElement("tr");

      [examId, group, `${count}問`].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value;
        td.style.padding = "8px";
        tr.appendChild(td);
      });

      table.appendChild(tr);
    });

    content.appendChild(table);

    // 後の登録処理で使用する
    
window.csvQuestions = questions;

// CSVの確認が完了したら登録ボタンを有効にする
document.getElementById("csvUploadButton").disabled = false;


  } catch (error) {
    window.csvQuestions = null;
    content.textContent = "CSVエラー：" + error.message;
  }
});

function makeGroupId(examId, groupName) {
  return JSON.stringify([examId, groupName]);
}

async function makeQuestionId(q) {
  // 検定・グループ・問題内容からIDを生成
  const source = JSON.stringify([
    q.examId,
    q.group,
    q.question,
    q.choice1,
    q.choice2,
    q.choice3,
    q.choice4,
    q.answer
  ]);

  const bytes = new TextEncoder().encode(source);
  const hash = await crypto.subtle.digest("SHA-256", bytes);

  const hex = Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");

  return "q_" + hex;
}

async function saveGroups(questions) {
  // CSVから検定・グループの組み合わせを抽出
  const groups = new Map();

  questions.forEach(q => {
    const id = makeGroupId(q.examId, q.group);

    if (!groups.has(id)) {
      groups.set(id, {
        examId: q.examId,
        name: q.group
      });
    }
  });

  // 既存のグループ設定を取得
  const snapshot = await getDocs(collection(db, "groups"));
  const existingIds = new Set(snapshot.docs.map(d => d.id));

  // 新しいグループだけを登録
  const newGroups = [...groups.entries()]
    .filter(([id]) => !existingIds.has(id));

  // Firestoreの書き込み上限に備えて分割
  for (let i = 0; i < newGroups.length; i += 400) {
    const batch = writeBatch(db);

    newGroups.slice(i, i + 400).forEach(([id, group]) => {
      batch.set(doc(db, "groups", id), {
        ...group,
        enabled: false
      });
    });

    await batch.commit();
  }

  return newGroups.length;
}

async function saveQuestions(questions) {
  let savedCount = 0;

  // Firestoreの書き込み上限に備えて分割
  for (let i = 0; i < questions.length; i += 400) {
    const batch = writeBatch(db);
    const chunk = questions.slice(i, i + 400);

    for (const q of chunk) {
      // 同じ問題内容なら同じIDを生成
      const questionId = await makeQuestionId(q);

      const questionRef = doc(db, "questions", questionId);

      batch.set(questionRef, {
        examId: q.examId,
        groupId: makeGroupId(q.examId, q.group),
        question: q.question,
        choice1: q.choice1,
        choice2: q.choice2,
        choice3: q.choice3,
        choice4: q.choice4,
        answer: q.answer
      });

      savedCount++;
    }

    await batch.commit();
  }

  return savedCount;
}

// CSVの解析が成功したときだけ登録可能にする
const csvFileInput = document.getElementById("csvFile");


csvFileInput.addEventListener("change", () => {

  )) {
    return;

  csvUploadButton.disabled = true;

  try {
    const groupCount = await saveGroups(questions);
    const questionCount = await saveQuestions(questions);

    alert(
      `登録が完了しました。\n` +
      `新規グループ：${groupCount}件\n` +
      `処理した問題：${questionCount}問`
    );

    await loadGroups();
  } catch (error) {
    console.error("CSV登録エラー：", error);
    alert("登録中にエラーが発生しました：" + error.message);
  } finally {
      csvUploadButton.disabled =
    !Array.isArray(window.csvQuestions) ||
    window.csvQuestions.length === 0;
  }
});

  if (!auth.currentUser) {

    return;
  }

  try {
    const batch = writeBatch(db);

    
checkboxes.forEach(checkbox => {
  console.log("保存するグループ：", {
    groupId: checkbox.value,
    enabled: checkbox.checked
  });

  const groupRef = doc(db, "groups", checkbox.value);


      batch.update(groupRef, {
        enabled: checkbox.checked

    await batch.commit();

    alert("出題設定を保存しました。");
  } catch (error) {
    console.error("出題設定の保存エラー：", error);
    alert("保存に失敗しました：" + error.message);

}
