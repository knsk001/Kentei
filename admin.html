
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム｜先生用管理画面</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
    <p>先生用管理画面</p>
  </header>

  
<main>
  
<section id="loginArea">
  <h2>先生用ログイン</h2>

  <p>メールアドレス</p>
  <input
    type="email"
    id="adminEmail"
    autocomplete="username"
    placeholder="メールアドレス"
  >

  <p>パスワード</p>
  <input
    type="password"
    id="adminPassword"
    autocomplete="current-password"
    placeholder="パスワード"
  >

  <p>
    <button id="loginButton" disabled>
      ログイン（準備中）
    </button>
  </p>
</section>
<hr>

  
<section id="adminArea" style="display:none;">
<h2>問題データ管理</h2>


  <h3>① 検定の選択</h3>
  <select id="examType">
    <option value="joho_shori">情報処理</option>
    <option value="joho_shori_2">情報処理２級</option>
    <option value="joho_kiso">情報基礎</option>
    <option value="bunsho_3">文書３級</option>
    <option value="bunsho_2">文書２級</option>
    <option value="bunsho_1">文書１級</option>
  </select>

  
<h3>② CSVファイルから問題を一括登録</h3>
<p>
  CSVに記載された検定IDとグループ名をもとに、
  問題を自動的に振り分けます。
</p>



  <p>CSVファイルを選択してください。</p>
  <input type="file" id="csvFile" accept=".csv">

  <p>
    
<button id="csvUploadButton" disabled>
  CSVを登録（準備中）
</button>

  </p>

  <hr>

  <h3>③ 出題するグループの選択</h3>
  <p>チェックしたグループから生徒に出題します。</p>

  <div id="groupList">
    グループ一覧は準備中です。
  </div>

  <p>
    <button disabled>出題設定を保存（準備中）</button>
  </p>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpXARufKNeaNgBOv30i83mQH5LXuswgBI",
  authDomain: "kentei-bff27.firebaseapp.com",
  projectId: "kentei-bff27",
  appId: "1:693090582582:web:3a0d01c693dd9b6d779897"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
  
const db = getFirestore(app);


const loginButton = document.getElementById("loginButton");
loginButton.disabled = false;
loginButton.textContent = "ログイン";

loginButton.addEventListener("click", async () => {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("loginArea").style.display = "none";
document.getElementById("adminArea").style.display = "block";

    alert("ログインに成功しました。");
  } catch (error) {
    console.error("ログインエラー：", error.code);
    alert("ログインできませんでした。メールアドレスとパスワードを確認してください。");
  }
});
  
onAuthStateChanged(auth, (user) => {
  if (user) {
    // ログイン済みの場合
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("adminArea").style.display = "block";
      // Firestoreからグループ一覧を取得
  loadGroups();
  } else {
    // 未ログインの場合
    document.getElementById("loginArea").style.display = "block";
    document.getElementById("adminArea").style.display = "none";
  }
});

async function loadGroups() {
  const groupList = document.getElementById("groupList");

  try {
    const snapshot = await getDocs(collection(db, "groups"));

    groupList.innerHTML = "";

    if (snapshot.empty) {
      groupList.textContent = "登録されているグループはありません。";
      return;
    }

    snapshot.forEach((doc) => {
      const group = doc.data();

      const label = document.createElement("label");
      label.style.display = "block";
      label.style.margin = "12px 0";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = doc.id;
      checkbox.checked = group.enabled === true;
      checkbox.disabled = true;

      label.appendChild(checkbox);
      label.appendChild(
        document.createTextNode(" " + (group.name || doc.id))
      );

      groupList.appendChild(label);
    });

  } catch (error) {
    console.error("グループ取得エラー：", error);
    groupList.textContent = "グループを取得できませんでした。";
  }
}

async function readCsvFile() {
  const fileInput = document.getElementById("csvFile");
  const file = fileInput.files[0];

  if (!file) {
    alert("CSVファイルを選択してください。");
    return null;
  }

  try {
    const text = await file.text();
    console.log("CSVファイル読み込み完了：", file.name);
    return text;
  } catch (error) {
    console.error("CSV読み込みエラー：", error);
    alert("CSVファイルを読み込めませんでした。");
    return null;
  }
}

</script>

</body>
</html>
