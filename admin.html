
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム｜先生用管理画面</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
    <p>先生用管理画面</p>
  </header>

  <main>
    <h2>問題データ管理</h2>
    <p>CSVファイルから検定問題を一括登録します。</p>

    <p>現在、管理機能を準備しています。</p>

    <button disabled>CSV登録（準備中）</button>
  </main>
</body>
</html>
