
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
  </header>

<main id="app">
  <h2>学習トレーニング</h2>
  <p>4択問題で検定合格を目指しましょう。</p>
  <button onclick="startQuiz()">学習を開始する</button>
</main>

<script>
const questions = [
  {
    question: "階層構造の最上位にあるフォルダは？",
    choices: [
      "サブディレクトリ",
      "カレントディレクトリ",
      "パス",
      "ルートディレクトリ"
    ],
    answer: 3
  },
  {
    question: "表計算ソフトでA3やB2などの表記は？",
    choices: [
      "シリアル値",
      "参照番地",
      "セル番地",
      "引数"
    ],
    answer: 2
  },
  {
    question: "コンピュータの基本ソフトウェアは？",
    choices: [
      "OS",
      "ブラウザ",
      "表計算ソフト",
      "ワープロソフト"
    ],
    answer: 0
  }
];


let current = 0;
let score = 0;

// 制限時間の設定
const TIME_LIMIT = 20;
let timeLeft = TIME_LIMIT;
let timerId = null;




let quizQuestions = [];

function startQuiz() {
  const QUESTION_COUNT = 20;

  // 問題数の確認
  if (questions.length < QUESTION_COUNT) {
    alert(
      "問題が不足しています。\n" +
      "現在：" + questions.length + "問\n" +
      "必要：20問"
    );
    return;
  }

  // 元の問題データを残してコピー
  quizQuestions = [...questions];

  // 問題の順番をランダムに変更
  for (let i = quizQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [quizQuestions[i], quizQuestions[j]] =
      [quizQuestions[j], quizQuestions[i]];
  }

  // 20問を抽出
  quizQuestions = quizQuestions.slice(0, QUESTION_COUNT);

  current = 0;
  score = 0;

  showQuestion();
}




function showQuestion() {
  clearInterval(timerId);

  
if (current >= quizQuestions.length) {
  // 終了時刻を取得
  const endTime = new Date().toLocaleTimeString("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });

  document.getElementById("app").innerHTML = `
    <h2>学習終了（${endTime}）</h2>
    <p>${quizQuestions.length}問中${score}問正解</p>
    <h2>${score * 5}点</h2>
    <button onclick="startQuiz()">もう一度挑戦</button>
  `;
  return;
}


  const q = quizQuestions[current];

  // 選択肢と正解情報をセットにする
  const shuffledChoices = q.choices.map(
    (text, index) => ({
      text: text,
      correct: index === q.answer
    })
  );

  // 選択肢をランダムに並べ替える
  for (let i = shuffledChoices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledChoices[i], shuffledChoices[j]] =
      [shuffledChoices[j], shuffledChoices[i]];
  }

  // 並べ替え後の選択肢と正解番号を更新
  q.choices = shuffledChoices.map(item => item.text);
  q.answer = shuffledChoices.findIndex(
    item => item.correct
  );

  document.getElementById("app").innerHTML = `
    <h2>第${current + 1}問 / ${quizQuestions.length}問</h2>
    <h3 id="timer" style="color:#1769aa;">
      残り時間：${TIME_LIMIT}秒
    </h3>
    <p>${q.question}</p>
    <div id="choices"></div>
    <p id="result"></p>
  `;

  const area = document.getElementById("choices");

  q.choices.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.style.display = "block";
    btn.style.width = "100%";
    btn.style.margin = "10px 0";

    btn.onclick = () => checkAnswer(index);
    area.appendChild(btn);
  });

  timeLeft = TIME_LIMIT;

  timerId = setInterval(() => {
    timeLeft--;

    document.getElementById("timer").textContent =
      `残り時間：${timeLeft}秒`;

    if (timeLeft <= 0) {
      clearInterval(timerId);

      document.querySelectorAll("#choices button")
        .forEach(btn => btn.disabled = true);

      document.getElementById("result").innerHTML = `
        <h3 style="color:red;">時間切れ！</h3>
        <p>正解：${q.choices[q.answer]}</p>
        <button onclick="nextQuestion()">次の問題へ</button>
      `;
    }
  }, 1000);
}



function checkAnswer(selected) {
  // 解答した瞬間にタイマーを停止
  clearInterval(timerId);

  const q = quizQuestions[current];
  const correct = selected === q.answer;

  if (correct) score++;

  // 選択肢の色を変更
  const buttons =
    document.querySelectorAll("#choices button");

  buttons.forEach((btn, index) => {
    btn.disabled = true;

    // 正解は緑色
    if (index === q.answer) {
      btn.style.backgroundColor = "#28a745";
      btn.style.color = "white";
    }

    // 選んだ不正解は赤色
    if (index === selected && !correct) {
      btn.style.backgroundColor = "#dc3545";
      btn.style.color = "white";
    }
  });

  // 正誤判定を表示
  document.getElementById("result").innerHTML = `
    <h3 style="color:${correct ? 'green' : 'red'};">
      ${correct ? "〇 正解！" : "× 不正解"}
    </h3>
    <p>正解：${q.choices[q.answer]}</p>
    <button onclick="nextQuestion()">次の問題へ</button>
  `;
}





function nextQuestion() {
  current++;
  showQuestion();
}
</script>

</body>
</html>
