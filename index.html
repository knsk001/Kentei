
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
  </header>

<main id="app">
  <h2>学習トレーニング</h2>
  <p>4択問題で検定合格を目指しましょう。</p>
  <button onclick="startQuiz()">学習を開始する</button>
</main>

<script>
const questions = [
  {
    question: "階層構造の最上位にあるフォルダは？",
    choices: [
      "サブディレクトリ",
      "カレントディレクトリ",
      "パス",
      "ルートディレクトリ"
    ],
    answer: 3
  },
  {
    question: "表計算ソフトでA3やB2などの表記は？",
    choices: [
      "シリアル値",
      "参照番地",
      "セル番地",
      "引数"
    ],
    answer: 2
  },
  {
    question: "コンピュータの基本ソフトウェアは？",
    choices: [
      "OS",
      "ブラウザ",
      "表計算ソフト",
      "ワープロソフト"
    ],
    answer: 0
  }
];


let current = 0;
let score = 0;

// 制限時間の設定
const TIME_LIMIT = 20;
let timeLeft = TIME_LIMIT;
let timerId = null;


function startQuiz() {
  current = 0;
  score = 0;
  showQuestion();
}


function showQuestion() {
  // 前の問題のタイマーを停止
  clearInterval(timerId);

  if (current >= questions.length) {
    document.getElementById("app").innerHTML =
      `<h2>学習終了</h2>
       <p>${questions.length}問中${score}問正解</p>
       <button onclick="startQuiz()">もう一度挑戦</button>`;
    return;
  }

  const q = questions[current];

  document.getElementById("app").innerHTML = `
    <h2>第${current + 1}問 / ${questions.length}問</h2>
    <h3 id="timer" style="color:#1769aa;">
      残り時間：${TIME_LIMIT}秒
    </h3>
    <p>${q.question}</p>
    <div id="choices"></div>
    <p id="result"></p>
  `;

  const area = document.getElementById("choices");

  q.choices.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.style.display = "block";
    btn.style.width = "100%";
    btn.style.margin = "10px 0";

    btn.onclick = () => checkAnswer(index);
    area.appendChild(btn);
  });

  // 20秒からカウントダウン
  timeLeft = TIME_LIMIT;

  timerId = setInterval(() => {
    timeLeft--;

    document.getElementById("timer").textContent =
      `残り時間：${timeLeft}秒`;

    if (timeLeft <= 0) {
      clearInterval(timerId);

      // 時間切れの場合は不正解
      document.querySelectorAll("#choices button")
        .forEach(btn => btn.disabled = true);

      document.getElementById("result").innerHTML = `
        <h3 style="color:red;">時間切れ！</h3>
        <p>正解：${q.choices[q.answer]}</p>
        <button onclick="nextQuestion()">次の問題へ</button>
      `;
    }
  }, 1000);
}


function checkAnswer(selected) {
  const q = questions[current];
  const correct = selected === q.answer;

  if (correct) score++;

  document.getElementById("result").innerHTML = `
    <h3>${correct ? "〇 正解！" : "× 不正解"}</h3>
    <p>正解：${q.choices[q.answer]}</p>
    <button onclick="nextQuestion()">次の問題へ</button>
  `;

  document.querySelectorAll("#choices button")
    .forEach(btn => btn.disabled = true);
}

function nextQuestion() {
  current++;
  showQuestion();
}
</script>

</body>
</html>
