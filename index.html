
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>検定学習システム</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f6fa;
      margin: 0;
      text-align: center;
    }
    header {
      background: #1769aa;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 24px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>検定学習システム</h1>
  </header>


<main id="app">
  <h2>学習トレーニング</h2>

  
<div id="examCodeArea">
  <h3>受験番号を入力してください</h3>

  <p>
    先生から指定された3桁の番号を入力します。
  </p>

  <input
    type="text"
    id="examCode"
    inputmode="numeric"
    maxlength="3"
    pattern="[0-9]{3}"
    placeholder="例：123"
    autocomplete="off"
    style="
      font-size: 24px;
      width: 120px;
      text-align: center;
      padding: 10px;
    "
  >
</div>


  <p>
    
<button onclick="verifyAndStartQuiz()">
  学習を開始する
</button>

  </p>
</main>


<script>


let current = 0;
let score = 0;

// 制限時間の設定
const TIME_LIMIT = 20;
let timeLeft = TIME_LIMIT;
let timerId = null;




let quizQuestions = [];

function startQuiz() {
  
  // Firestoreの問題データが読み込まれるまで待つ
  if (!window.firestoreQuestions) {
    alert("問題データを読み込み中です。数秒後にもう一度お試しください。");
    return;
  }



const selectedExam = window.selectedExam;

if (!selectedExam) {
  alert("受験番号を入力してから開始してください。");
  return;
}



console.log("選択した検定：", selectedExam);

  const QUESTION_COUNT = 10;

  // Firestoreから取得した問題を検定別に抽出
const availableQuestions = (window.firestoreQuestions || [])
  .filter(q => q.examId === selectedExam);

// 問題数の確認
if (availableQuestions.length < QUESTION_COUNT) {
  alert(
    "問題が不足しています。\n" +
    "現在：" + availableQuestions.length + "問\n" +
    "必要：" + QUESTION_COUNT + "問"
  );
  return;
}

  // 元の問題データを残してコピー
  quizQuestions = (window.firestoreQuestions || []).filter(q => q.examId === selectedExam);

  // 問題の順番をランダムに変更
  for (let i = quizQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [quizQuestions[i], quizQuestions[j]] =
      [quizQuestions[j], quizQuestions[i]];
  }

  // 20問を抽出
  quizQuestions = quizQuestions.slice(0, QUESTION_COUNT);

  current = 0;
  score = 0;

  showQuestion();
}




function showQuestion() {
  clearInterval(timerId);

  
if (current >= quizQuestions.length) {
  // 終了時刻を取得
  const endTime = new Date().toLocaleTimeString("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    // second: "2-digit",
    hour12: false
  });

  document.getElementById("app").innerHTML = `
    <h2>学習終了（${endTime}）</h2>
    <p>${quizQuestions.length}問中${score}問正解</p>
    <h2>${Math.round(score / quizQuestions.length * 100)}点</h2>
    <button onclick="startQuiz()">もう一度挑戦</button>
  `;
  return;
}


  const q = quizQuestions[current];

  // 選択肢と正解情報をセットにする
  const shuffledChoices = q.choices.map(
    (text, index) => ({
      text: text,
      correct: index === q.answer
    })
  );

  // 選択肢をランダムに並べ替える
  for (let i = shuffledChoices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledChoices[i], shuffledChoices[j]] =
      [shuffledChoices[j], shuffledChoices[i]];
  }

  // 並べ替え後の選択肢と正解番号を更新
  q.choices = shuffledChoices.map(item => item.text);
  q.answer = shuffledChoices.findIndex(
    item => item.correct
  );

  document.getElementById("app").innerHTML = `
    <h2>第${current + 1}問 / ${quizQuestions.length}問</h2>
    <h3 id="timer" style="color:#1769aa;">
      残り時間：${TIME_LIMIT}秒
    </h3>
    <p>${q.question}</p>
    <div id="choices"></div>
    <p id="result"></p>
  `;

  const area = document.getElementById("choices");

  q.choices.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.style.display = "block";
    btn.style.width = "100%";
    btn.style.margin = "10px 0";

    btn.onclick = () => checkAnswer(index);
    area.appendChild(btn);
  });

  timeLeft = TIME_LIMIT;

  timerId = setInterval(() => {
    timeLeft--;

    document.getElementById("timer").textContent =
      `残り時間：${timeLeft}秒`;

    if (timeLeft <= 0) {
      clearInterval(timerId);

      document.querySelectorAll("#choices button")
        .forEach(btn => btn.disabled = true);

      document.getElementById("result").innerHTML = `
        <h3 style="color:red;">時間切れ！</h3>
        <p>正解：${q.choices[q.answer]}</p>
        <button onclick="nextQuestion()">次の問題へ</button>
      `;
    }
  }, 1000);
}



function checkAnswer(selected) {
  // 解答した瞬間にタイマーを停止
  clearInterval(timerId);

  const q = quizQuestions[current];
  const correct = selected === q.answer;

  if (correct) score++;

  // 選択肢の色を変更
  const buttons =
    document.querySelectorAll("#choices button");

  buttons.forEach((btn, index) => {
    btn.disabled = true;

    // 正解は緑色
    if (index === q.answer) {
      btn.style.backgroundColor = "#28a745";
      btn.style.color = "white";
    }

    // 選んだ不正解は赤色
    if (index === selected && !correct) {
      btn.style.backgroundColor = "#dc3545";
      btn.style.color = "white";
    }
  });

  // 正誤判定を表示
  document.getElementById("result").innerHTML = `
    <h3 style="color:${correct ? 'green' : 'red'};">
      ${correct ? "〇 正解！" : "× 不正解"}
    </h3>
    <p>正解：${q.choices[q.answer]}</p>
    <button onclick="nextQuestion()">次の問題へ</button>
  `;
}





function nextQuestion() {
  current++;
  showQuestion();
}
</script>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDpXARufKNeaNgBOv30i83mQH5LXuswgBI",
    authDomain: "kentei-bff27.firebaseapp.com",
    projectId: "kentei-bff27",
    storageBucket: "kentei-bff27.firebasestorage.app",
    messagingSenderId: "693090582582",
    appId: "1:693090582582:web:3a0d01c693dd9b6d779897"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  

async function loadQuestions() {
  try {
    // 問題とグループ設定を取得
    const snapshot = await getDocs(collection(db, "questions"));
    const groupSnapshot = await getDocs(collection(db, "groups"));

    // 先生がチェックしたグループを取得
    const enabledGroups = new Set();

    groupSnapshot.forEach(groupDoc => {
      const group = groupDoc.data();

      if (group.enabled === true) {
        enabledGroups.add(groupDoc.id);
      }
    });

    const loadedQuestions = [];

    snapshot.forEach(questionDoc => {
      const data = questionDoc.data();

      // チェックされていないグループの問題は除外
      if (!data.groupId || !enabledGroups.has(data.groupId)) {
        return;
      }

      loadedQuestions.push({
        id: questionDoc.id,
        examId: data.examId,
        groupId: data.groupId,
        question: data.question,
        choices: [
          data.choice1,
          data.choice2,
          data.choice3,
          data.choice4
        ],
        answer: data.answer - 1
      });
    });

    console.log("出題対象の問題：", loadedQuestions);

    window.firestoreQuestions = loadedQuestions;
    return loadedQuestions;

  } catch (error) {
    console.error("問題の取得に失敗しました：", error);
    window.firestoreQuestions = [];
    return [];
  }
}

  loadQuestions();
  
async function getEnabledGroupIds(examId) {
  const snapshot = await getDocs(collection(db, "groups"));

  const enabledGroupIds = new Set();

  snapshot.forEach(groupDoc => {
    const group = groupDoc.data();

    if (
      group.examId === examId &&
      group.enabled === true
    ) {
      enabledGroupIds.add(groupDoc.id);
    }
  });

  return enabledGroupIds;
}

async function verifyExamCode() {
  const input = document.getElementById("examCode");

  if (!input) {
    alert("受験番号の入力欄が見つかりません。");
    return;
  }

  const code = input.value.trim();

  // 3桁の数字か確認
  if (!/^[0-9]{3}$/.test(code)) {
    alert("受験番号は3桁の数字で入力してください。");
    return;
  }

  try {
    // Firestoreから受験番号を照合
    const codeRef = doc(db, "examCodes", code);
    const codeSnapshot = await getDoc(codeRef);

    if (!codeSnapshot.exists()) {
      alert("受験番号が登録されていません。");
      return;
    }

    const data = codeSnapshot.data();

    if (data.enabled !== true) {
      alert("この受験番号は現在使用できません。");
      return;
    }

    // 対応する検定を記録
    window.selectedExam = data.examId;

    return data.examId;

  } catch (error) {
    console.error("受験番号照合エラー：", error);
    alert("受験番号を確認できませんでした。");
    return;
  }
}

// HTML側から呼び出せるようにする
window.verifyExamCode = verifyExamCode;

async function verifyAndStartQuiz() {
  // 受験番号を照合して検定を判定
  const examId = await verifyExamCode();

  // 照合できなければ開始しない
  if (!examId) {
    return;
  }

  // 判定された検定を設定
  window.selectedExam = examId;

  // 既存の学習開始処理を実行
  startQuiz();
}

// HTMLの開始ボタンから呼び出せるようにする
window.verifyAndStartQuiz = verifyAndStartQuiz;

</script>
</body>
</html>
